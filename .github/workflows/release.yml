name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install mpy-cross==1.29.0.post2

      - name: Extract Tag Version
        id: get_version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check tag matches package.json
        run: |
          PKG_VERSION=$(python -c "import json; print(json.load(open('package.json'))['version'])")
          if [ "$PKG_VERSION" != "${{ steps.get_version.outputs.version }}" ]; then
            echo "::error::Tag ${{ steps.get_version.outputs.tag }} does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Build Bundle Artifacts
        run: |
          python tools/bundle.py

      - name: Verify committed dist/ matches the release build
        run: |
          git diff --exit-code dist/

      - name: Run tests
        run: |
          python -m unittest discover tests

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Untethered ${{ steps.get_version.outputs.tag }}
          files: |
            dist/untethered.mpy
            dist/untethered.py
          draft: false
          prerelease: false
          generate_release_notes: true
